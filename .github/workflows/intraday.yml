name: Intraday FX Scrape

on:
  # Stockholm 08/13/18 lokal tid. GitHub-cron är UTC-only, så vi kör
  # 06/11/16 UTC (≈ 08/13/18 CEST på sommaren, 07/12/17 CET på vintern).
  # Minuten är :23, inte :00 — schemalagda körningar glider/hoppas oftast
  # vid heltimmen, en udda minut minskar risken. Ändå best-effort.
  schedule:
    - cron: "23 6,11,16 * * *"

  # Låter dig köra manuellt från Actions-fliken.
  workflow_dispatch:

# Låt workflowens GITHUB_TOKEN pusha tillbaka CSV:erna till repot.
permissions:
  contents: write

# Låt aldrig två körningar överlappa — de skriver till samma månadsfil.
concurrency:
  group: intraday-fx-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # Full historik så att git pull --rebase har något att jobba mot.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run intraday scraper (retry once after 15 min on failure)
        # intraday.py exits non-zero if ANY scraper fails. nick-invision/retry
        # then waits 15 minutes (900s) and runs it again — up to 3 attempts.
        uses: nick-invision/retry@v3
        with:
          timeout_minutes: 20
          max_attempts: 3
          retry_wait_seconds: 900
          command: python Intraday.py

      - name: Commit and push new CSVs
        # Runs whether or not the scrape ultimately succeeded, so we still save
        # whatever data we did manage to collect.
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "Inga ändringar att committa."
          else
            git commit -m "Intraday FX scrape: $(date -u '+%Y-%m-%d %H:%M')"
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            git push
          fi